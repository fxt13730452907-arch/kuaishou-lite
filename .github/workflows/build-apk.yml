name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.1' # 升级到支持 SDK 35 的版本
          cache: true
          
      - name: Generate Android Scaffolding
        run: flutter create . --project-name kuaishou_lite --platforms=android
        
      - name: Force Upgrade AGP and Gradle
        run: |
          # 自动升级 AGP 和 Gradle 版本以支持 compileSdk 35
          sed -i "s/com.android.application' version '8.1.0/com.android.application' version '8.9.1/g" android/settings.gradle || true
          sed -i "s/com.android.application' version '8.3.0/com.android.application' version '8.9.1/g" android/settings.gradle || true
          
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle.kts || true

      - run: flutter pub get
      
      - name: Fix package_info_plus bug
        run: |
          find ~/.pub-cache/hosted/pub.dev/package_info_plus-* -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' {} + || true
          find ~/.pub-cache/hosted/pub.dev/package_info_plus-* -name "build.gradle" -exec sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 35/g' {} + || true
          
      - run: flutter build apk --release --split-per-abi
      
      - uses: actions/upload-artifact@v4
        with:
          name: kuaishou-lite-apk
          path: build/app/outputs/flutter-apk/*.apk
