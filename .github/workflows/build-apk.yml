name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.2'
          cache: true
          
      - name: Generate Android Project
        run: flutter create . --project-name kuaishou_lite --platforms=android --org com.example
        
      - name: Add Network Permission
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      
      - uses: actions/upload-artifact@v4
        with:
          name: kuaishou-lite-apk
          path: build/app/outputs/flutter-apk/*.apk
