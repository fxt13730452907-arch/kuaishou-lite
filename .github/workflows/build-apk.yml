name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.2'
          cache: true
          
      - name: Generate Android Scaffolding
        run: flutter create . --project-name kuaishou_lite --platforms=android
        
      - name: Fix Android SDK versions
        run: |
          # 如果文件存在再去修改，避免找不到文件报错
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
          fi
          
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          fi

      - run: flutter pub get
      
      - name: Fix package_info_plus bug
        run: |
          find ~/.pub-cache/hosted/pub.dev/package_info_plus-* -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' {} +
          find ~/.pub-cache/hosted/pub.dev/package_info_plus-* -name "build.gradle" -exec sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 35/g' {} +
          
      - run: flutter build apk --release --split-per-abi
      
      - uses: actions/upload-artifact@v4
        with:
          name: kuaishou-lite-apk
          path: build/app/outputs/flutter-apk/*.apk
