name: kuaishou_lite
description: A lightweight short video app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: 4.7.0

# 强制锁定底层依赖版本，防止自动升级导致不兼容
dependency_overrides:
  webview_flutter_android: 3.16.9

flutter:
  uses-material-design: true
